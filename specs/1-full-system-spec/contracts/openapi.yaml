openapi: 3.0.0
info:
  title: FastAPI RAG Backend API
  version: 1.0.0
  description: API for the AI and Robotics learning platform, including RAG, authentication, and personalization.

servers:
  - url: http://localhost:8000/api
    description: Local Development Server

tags:
  - name: Ingestion
    description: Operations related to chapter ingestion and embedding.
  - name: Query
    description: Operations for RAG-based querying of chapter content.
  - name: Authentication
    description: User registration and login.
  - name: Profile
    description: User profile management.

paths:
  /ingest:
    post:
      summary: Ingest Chapters
      tags: [Ingestion]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                chapter_dir:
                  type: string
                  description: Directory containing markdown chapters.
                  example: "./docusaurus-chapters"
                collection_name:
                  type: string
                  description: Name of the Qdrant collection to store embeddings.
                  example: "ai_robotics_chapters"
      responses:
        '200':
          description: Successful ingestion.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: No chapters found.
        '500':
          description: Internal server error.

  /token:
    post:
      summary: Login for Access Token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  example: password
              required:
                - username
                - password
      responses:
        '200':
          description: Successful login.
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type:
                    type: string
                    example: bearer
        '401':
          description: Invalid credentials.

  /register:
    post:
      summary: Register New User
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInDB'
        '400':
          description: Email already registered.

  /profile/me:
    get:
      summary: Get Current User Profile
      tags: [Profile]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInDB'
        '401':
          description: Unauthorized.

  /query:
    post:
      summary: Query Chapters with RAG
      tags: [Query]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Successful query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResponse'
        '500':
          description: Internal server error.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserBase:
      type: object
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        username:
          type: string
          example: testuser
      required:
        - email
        - username
    UserCreate:
      allOf:
        - $ref: '#/components/schemas/UserBase'
        - type: object
          properties:
            password:
              type: string
              example: password123
          required:
            - password
    UserInDB:
      allOf:
        - $ref: '#/components/schemas/UserBase'
        - type: object
          properties:
            id:
              type: integer
              example: 1
            hashed_password:
              type: string
              example: hashed_password123
          required:
            - id
            - hashed_password
    QueryRequest:
      type: object
      properties:
        query_text:
          type: string
          description: The text query for RAG.
          example: "What is machine learning?"
        collection_name:
          type: string
          description: Name of the Qdrant collection to query.
          example: "ai_robotics_chapters"
        top_k:
          type: integer
          description: Number of top results to return.
          default: 5
          example: 3
      required:
        - query_text
        - collection_name
    QueryResponse:
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              score:
                type: number
                format: float
                example: 0.95
              payload:
                type: object
                description: The payload (metadata and chunk content) from Qdrant.
      required:
        - results
