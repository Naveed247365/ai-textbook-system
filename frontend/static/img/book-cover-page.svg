<svg width="800" height="1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="1000" fill="#f0f9ff"/>
  
  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f0ff"/>
      <stop offset="100%" stop-color="#cce6ff"/>
    </linearGradient>
    
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c9a7"/>
      <stop offset="100%" stop-color="#0066cc"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="1000" fill="url(#bgGradient)"/>
  
  <!-- Abstract robot silhouette -->
  <g transform="translate(400, 500)">
    <!-- Head -->
    <circle cx="0" cy="-180" r="60" fill="url(#robotGradient)" stroke="#0066cc" stroke-width="2"/>
    
    <!-- Eyes -->
    <circle cx="-20" cy="-190" r="8" fill="white"/>
    <circle cx="20" cy="-190" r="8" fill="white"/>
    <circle cx="-20" cy="-190" r="4" fill="#ff6b35"/>
    <circle cx="20" cy="-190" r="4" fill="#ff6b35"/>
    
    <!-- Body -->
    <rect x="-60" y="-100" width="120" height="160" rx="15" fill="url(#robotGradient)" stroke="#0066cc" stroke-width="2"/>
    
    <!-- Arms -->
    <rect x="-110" y="-80" width="40" height="120" rx="20" fill="url(#robotGradient)" stroke="#0066cc" stroke-width="2"/>
    <rect x="70" y="-80" width="40" height="120" rx="20" fill="url(#robotGradient)" stroke="#0066cc" stroke-width="2"/>
    
    <!-- Legs -->
    <rect x="-40" y="60" width="35" height="120" rx="15" fill="url(#robotGradient)" stroke="#0066cc" stroke-width="2"/>
    <rect x="5" y="60" width="35" height="120" rx="15" fill="url(#robotGradient)" stroke="#0066cc" stroke-width="2"/>
    
    <!-- Circuit patterns -->
    <path d="M-30,-60 Q0,-80 30,-60" stroke="#ff6b35" stroke-width="2" fill="none"/>
    <path d="M-30,-30 Q0,-50 30,-30" stroke="#ff6b35" stroke-width="2" fill="none"/>
    <path d="M-30,0 Q0,-20 30,0" stroke="#ff6b35" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="850" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#1a365d">
    Physical AI &amp; Humanoid Robotics
  </text>
  
  <text x="400" y="890" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#4a5568">
    Your Guide to Building Intelligent Systems
  </text>
  
  <!-- Decorative elements -->
  <g opacity="0.1">
    <circle cx="150" cy="150" r="80" stroke="#0066cc" stroke-width="2" fill="none"/>
    <circle cx="650" cy="850" r="60" stroke="#00c9a7" stroke-width="2" fill="none"/>
    <circle cx="100" cy="900" r="40" stroke="#ff6b35" stroke-width="2" fill="none"/>
    
    <!-- Abstract tech patterns -->
    <path d="M50 50 L100 30 M100 30 L120 70 M120 70 L70 90 Z" stroke="#0066cc" stroke-width="2" fill="none"/>
    <path d="M700 100 L750 80 M750 80 L770 120 M770 120 L720 140 Z" stroke="#00c9a7" stroke-width="2" fill="none"/>
  </g>
</svg>