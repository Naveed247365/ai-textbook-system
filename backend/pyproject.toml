[tool.poetry]
name = "ai-textbook-backend"
version = "0.1.0"
description = "Backend for the Physical AI & Humanoid Robotics Textbook System"
authors = ["Your Name <your.email@example.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
qdrant-client = "^1.12.0"
pydantic = "^2.9.0"
python-jose = "^3.3.0"
passlib = "^1.7.4"
python-multipart = "^0.0.20"
python-dotenv = "^1.0.0"
requests = "^2.32.0"
google-generativeai = "^0.4.0"
asyncpg = "^0.29.0"
pydantic-settings = "^2.0.0"
PyJWT = "^2.8.0"
email-validator = "^2.1.1"
transformers = "^4.35.0"
torch = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
start = "uvicorn src.main:app --reload --host 0.0.0.0 --port 8000"